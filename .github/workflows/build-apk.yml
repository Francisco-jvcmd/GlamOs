name: Build Android APK

on:
  workflow_dispatch: # Permite compilar a demanda con un clic en la pestaña 'Actions' de GitHub
  push:
    branches:
      - main
    paths:
      - 'apps/web/**'
      - 'packages/shared/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build-apk:
    name: Build Signed Android APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Configure Android SDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > apps/web/android/local.properties

      - name: Install Monorepo Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Shared & Web Assets
        run: |
          pnpm --filter @glamos/shared build
          pnpm --filter @glamos/web build

      - name: Sync Capacitor Android
        run: pnpm --filter @glamos/web exec cap sync android

      - name: Make Gradlew Executable
        run: chmod +x apps/web/android/gradlew

      - name: Build Release APK
        run: |
          cd apps/web/android
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Build Debug APK
        run: |
          cd apps/web/android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: glamos-release-apk
          path: apps/web/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: glamos-debug-apk
          path: apps/web/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
